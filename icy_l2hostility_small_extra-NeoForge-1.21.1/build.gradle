plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_mc
        mappingsVersion = parchment_version
    }

    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    compileOnly files("D:/MinecraftModding/curiosapi/curios-neoforge-${curios_version}.jar")
    compileOnly files("D:/MinecraftModding/莱特兰/[潘多拉之咒]curseofpandora-3.0.7.jar")
    compileOnly files("../icy_lib-NeoForge-1.21.1/build/libs/icy_lib-${icy_lib_version}.jar")
    compileOnly files("D:/MinecraftModding/莱特兰/l2hostility-${l2hostility_version}.jar")
    compileOnly fileTree(dir: "D:/MinecraftModding/莱特兰/L2Hostility-1.21/L2Hostility-1.21/libs",
            include: ['*.jar'], exclude: ['*-sources.jar'])

    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        "-AoutrefmapFile=${layout.buildDirectory.file("tmp/compileJava/${mod_id}.refmap.json").get().asFile.absolutePath}".toString(),
        "-AdefaultObfuscationEnv=searge",
        "-AreobfSrgFile="
    ]
    options.forkOptions.jvmArgs += "-Dmixin.env.remapRefMap=false"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            neoforge_version: neoforge_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json, ${mod_id}.pandora.mixins.json"
        ])
    }
    from(layout.buildDirectory.dir("tmp/compileJava")) {
        include "${mod_id}.refmap.json"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
